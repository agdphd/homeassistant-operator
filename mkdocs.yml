site_name: Home Assistant Operator
site_description: Kubernetes operator for deploying and managing Home Assistant instances
site_url: https://przemekhys.github.io/homeassistant-operator/
repo_name: przemekhys/homeassistant-operator
repo_url: https://github.com/przemekhys/homeassistant-operator
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - include-markdown:

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Home Assistant CR: user-guide/homeassistant.md
    - Bootstrap: user-guide/bootstrap.md
    - Secrets Management: user-guide/secrets.md
    - Configuration Management: user-guide/configuration.md
    - Automations: user-guide/automations.md
    - Scenes: user-guide/scenes.md
    - Scripts: user-guide/scripts.md
    - Integrations: user-guide/integrations.md
    - Infrastructure (Floor/Label/Area): user-guide/infrastructure.md
    - Backup: user-guide/backup.md
    - Security (Pod Security Standards): user-guide/security.md
    - TLS (cert-manager): user-guide/tls.md
    - Signed Releases: user-guide/signed-releases.md
    - Upgrade: user-guide/upgrade.md
  - Ecosystem Guides:
    - Overview: ecosystem/index.md
    - Flux CD: ecosystem/flux.md
    - External Secret Management: ecosystem/secrets-management.md
  - Reference:
    - CRD API Reference: reference/api.md
    - Troubleshooting: reference/troubleshooting.md
    - FAQ: reference/faq.md
    - Changelog: reference/changelog.md
  - Development:
    - Contributing: development/contributing.md
    - Branching & Releases: development/branching.md
    - Architecture: development/architecture.md
    - Testing: development/testing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/przemekhys/homeassistant-operator
