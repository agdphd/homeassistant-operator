name: Security Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Report status
        if: success()
        run: echo "✅ No vulnerabilities found"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Vulnerabilities detected!"
          echo "Please update affected dependencies or review the security report above."
          exit 1

  pod-security:
    name: Restricted Pod Security Standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify operator manifests satisfy "restricted"
        run: make verify-pss

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Operator manifests do not satisfy the restricted Pod Security Standard!"
          echo "verify-pss checks two render paths — review whichever the log flagged:"
          echo "  - Kustomize: config/manager/manager.yaml (PSA namespace labels + securityContext)"
          echo "  - Helm: charts/homeassistant-operator/templates/namespace.yaml, deployment.yaml, values.yaml"
          exit 1

  kyverno-policy-test:
    name: Sample Kyverno Policy Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Kyverno CLI
        run: |
          # renovate: datasource=github-releases depName=kyverno/kyverno
          KYVERNO_CLI_VERSION="v1.18.2"
          go install "github.com/kyverno/kyverno/cmd/cli/kubectl-kyverno@${KYVERNO_CLI_VERSION}"

      - name: Test sample verification policy
        run: kubectl-kyverno test hack/kyverno/kyverno-test/
