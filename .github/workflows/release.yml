name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never abort a release mid-publish

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Run linter
        run: make lint

      - name: Generate manifests
        run: make manifests generate

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-publish:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update chart version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" charts/homeassistant-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/homeassistant-operator/Chart.yaml
          sed -i "s/^  tag:.*/  tag: \"${VERSION}\"/" charts/homeassistant-operator/values.yaml

      - name: Lint Helm chart
        run: helm lint charts/homeassistant-operator

      - name: Package and push Helm chart
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p dist
          helm package charts/homeassistant-operator --destination dist/
          helm push dist/homeassistant-operator-${{ steps.version.outputs.VERSION }}.tgz oci://${{ env.REGISTRY }}/${OWNER}/charts

  smoke-oci:
    needs: helm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # annotate the GitHub Release when the smoke test fails
      issues: write # raise a maintainer alert when the smoke test fails
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Helm and k3d
        uses: ./.github/actions/helm-setup
        with:
          install-k3d: "true"

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the published OCI chart
        id: smoke
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          HELM_REGISTRY="${{ env.REGISTRY }}/${OWNER}" ./hack/helm-smoke-oci.sh

      # On failure: alert the maintainer and mark the release "needs verification".
      # Deliberately NO automatic yank/delete of the published artifact — the
      # decision to withdraw a release stays manual.
      - name: Alert on smoke-test failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const version = process.env.GITHUB_REF_NAME;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Post-publish smoke test FAILED for ${version}`;
            const body = [
              `The post-publish OCI smoke test failed for **${version}**.`,
              ``,
              `The chart was published but does **not** install cleanly from the OCI`,
              `registry. This release is marked **needs verification**. The artifact`,
              `was intentionally NOT yanked — decide manually whether to withdraw it.`,
              ``,
              `Failed run: ${runUrl}`,
            ].join('\n');
            // Create the alert issue defensively: if the labels do not exist the
            // API returns 422, so fall back to creating the issue without labels
            // rather than losing the maintainer notification entirely.
            let issueNumber = null;
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['release', 'needs-verification'],
              });
              issueNumber = issue.data.number;
            } catch (e) {
              core.warning(`Issue creation with labels failed (${e.message}); retrying without labels.`);
              try {
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body,
                });
                issueNumber = issue.data.number;
              } catch (e2) {
                core.error(`Could not open alert issue for ${version}: ${e2.message}`);
              }
            }
            if (issueNumber) core.notice(`Opened alert issue #${issueNumber} for ${version}`);
            const ref = issueNumber ? ` (see #${issueNumber})` : '';
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag: version,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: rel.data.id,
                body: `> ⚠️ **Needs verification** — post-publish smoke test failed${ref}.\n\n${rel.data.body || ''}`,
              });
            } catch (e) {
              core.warning(`Could not annotate release ${version}: ${e.message}`);
            }
