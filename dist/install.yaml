            description: HomeAssistantSecretsSpec defines the desired state of HomeAssistantSecrets.
            properties:
              autoRestart:
                default: true
                description: |-
                  AutoRestart controls whether the Home Assistant pod should be automatically
                  restarted when secrets change. When enabled, the controller updates an annotation
                  on the StatefulSet to trigger a rolling restart.
                type: boolean
              homeAssistantRef:
                description: HomeAssistantRef references the HomeAssistant CR that
                  will use these secrets
                properties:
                  name:
                    description: Name of the HomeAssistant resource
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              secretRefs:
                description: |-
                  SecretRefs is a list of references to Kubernetes Secrets.
                  Keys from these Secrets will be merged into the generated secrets.yaml
                items:
                  description: SecretKeyReference defines a reference to a specific
                    key in a Kubernetes Secret.
                  properties:
                    keys:
                      description: Keys to extract from the Secret. If empty, all
                        keys will be included.
                      items:
                        type: string
                      type: array
                    name:
                      description: Name of the Secret
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
            required:
            - homeAssistantRef
            - secretRefs
            type: object
          status:
            description: HomeAssistantSecretsStatus defines the observed state of
              HomeAssistantSecrets.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the HomeAssistantSecrets state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastError:
                description: LastError contains a human-readable description of the
                  last error encountered
                type: string
              lastUpdated:
                description: LastUpdated is the timestamp when the secrets were last
                  updated
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed HomeAssistantSecrets
                format: int64
                type: integer
              secretsHash:
                description: |-
                  SecretsHash is the SHA256 hash of the generated secrets.yaml content.
                  Used to detect changes and trigger pod restarts.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: spec.homeAssistantRef is immutable after creation
          rule: '!has(oldSelf.spec) || self.spec.homeAssistantRef == oldSelf.spec.homeAssistantRef'
    served: true
    storage: true
    subresources:
      status: {}
