{{- if .Values.webhook.enabled }}
{{- $fullname := include "homeassistant-operator.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $svcName := include "homeassistant-operator.webhookServiceName" . }}
{{- $certSecret := include "homeassistant-operator.webhookCertSecretName" . }}
{{- $certName := include "homeassistant-operator.webhookCertificateName" . }}
{{- $vwcName := include "homeassistant-operator.validatingWebhookConfigurationName" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "homeassistant-operator.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
  ports:
    - port: 443
      targetPort: webhook-server
      protocol: TCP
{{- if .Values.webhook.certManager.enabled }}
---
# cert-manager path (opt-in): cert-manager issues the serving certificate and
# injects the CA into the ValidatingWebhookConfiguration.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned-issuer
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $certName }}
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  secretName: {{ $certSecret }}
  dnsNames:
    - {{ printf "%s.%s.svc" $svcName $ns }}
    - {{ printf "%s.%s.svc.cluster.local" $svcName $ns }}
  issuerRef:
    name: {{ $fullname }}-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
{{- /* Self-managed serving-cert Secret is created by the operator itself
       (cert-controller updates but never creates it), so it is intentionally not
       rendered here — this avoids Helm ownership conflicts and cert-manager
       <-> self-managed switch issues. */}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $vwcName }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" $ns $certName }}
  {{- end }}
webhooks:
  - name: vhomeassistant-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      # In the default (self-managed) mode the operator injects caBundle at runtime
      # via cert-controller; with cert-manager it is injected via the annotation above.
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistant
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistants"]
  - name: vhomeassistantautomation-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistantautomation
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantautomations"]
  - name: vhomeassistantscene-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistantscene
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantscenes"]
  - name: vhomeassistantscript-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistantscript
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantscripts"]
  - name: vhomeassistantconfiguration-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistantconfiguration
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantconfigurations"]
{{- end }}
