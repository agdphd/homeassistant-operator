{{- if .Values.webhook.enabled }}
{{- $fullname := include "homeassistant-operator.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $svcName := printf "%s-webhook-service" $fullname }}
{{- $certSecret := printf "%s-webhook-server-cert" $fullname }}
{{- $certName := printf "%s-webhook-serving-cert" $fullname }}
{{- $vwcName := printf "%s-validating-webhook-configuration" $fullname }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "homeassistant-operator.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
  ports:
    - port: 443
      targetPort: webhook-server
      protocol: TCP
{{- if .Values.webhook.certManager.enabled }}
---
# cert-manager path (opt-in): cert-manager issues the serving certificate and
# injects the CA into the ValidatingWebhookConfiguration.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned-issuer
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $certName }}
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  secretName: {{ $certSecret }}
  dnsNames:
    - {{ printf "%s.%s.svc" $svcName $ns }}
    - {{ printf "%s.%s.svc.cluster.local" $svcName $ns }}
  issuerRef:
    name: {{ $fullname }}-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $vwcName }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" $ns $certName }}
  {{- end }}
webhooks:
  - name: vhomeassistant-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      # In the default (self-managed) mode the operator injects caBundle at runtime
      # via cert-controller; with cert-manager it is injected via the annotation above.
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistant
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistants"]
{{- end }}
