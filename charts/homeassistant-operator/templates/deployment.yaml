apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homeassistant-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "homeassistant-operator.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "homeassistant-operator.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homeassistant-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ include "homeassistant-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            {{- if .Values.webhook.enabled }}
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if not (empty .Values.watchNamespaces) }}
            - name: WATCH_NAMESPACES
              value: {{ .Values.watchNamespaces | join "," | quote }}
            {{- end }}
            {{- if not .Values.webhook.enabled }}
            - name: ENABLE_WEBHOOKS
              value: "false"
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: WEBHOOK_SERVICE_NAME
              value: {{ include "homeassistant-operator.fullname" . }}-webhook-service
            - name: WEBHOOK_SECRET_NAME
              value: {{ include "homeassistant-operator.fullname" . }}-webhook-server-cert
            - name: WEBHOOK_CONFIG_NAME
              value: {{ include "homeassistant-operator.fullname" . }}-validating-webhook-configuration
            - name: WEBHOOK_SELF_MANAGE_CERT
              value: {{ not .Values.webhook.certManager.enabled | quote }}
            {{- end }}
          {{- if .Values.webhook.enabled }}
          ports:
            - name: webhook-server
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              # Writable in self-managed mode (the operator writes the cert here);
              # read-only when cert-manager provides it via a mounted Secret.
              readOnly: {{ .Values.webhook.certManager.enabled }}
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-certs
          {{- if .Values.webhook.certManager.enabled }}
          secret:
            secretName: {{ include "homeassistant-operator.fullname" . }}-webhook-server-cert
          {{- else }}
          # Self-managed: cert-controller writes the serving certificate here and
          # persists it to a Secret; an emptyDir avoids a chicken-and-egg on the Secret.
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
