{{- if not (empty .Values.watchNamespaces) }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "homeassistant-operator.fullname" $ }}-manager-rolebinding
  namespace: {{ . }}
  labels:
    {{- include "homeassistant-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "homeassistant-operator.fullname" $ }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "homeassistant-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
