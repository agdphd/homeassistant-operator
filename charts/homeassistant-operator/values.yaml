image:
  repository: ghcr.io/przemekhys/homeassistant-operator
  # Defaults to chart appVersion when empty
  tag: "1.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Defaults to fullname when empty
  name: ""
  annotations: {}

namespace:
  # create: when true, the chart renders the release Namespace and labels it to
  # enforce the "restricted" Pod Security Standard (version latest). Install the
  # chart WITHOUT `--create-namespace` so the chart owns the namespace, e.g.:
  #   helm install ha-operator ... -n homeassistant-operator-system --set namespace.create=true
  # When false (default), Helm/you manage the namespace and no PSA labels are added;
  # the operator pod is restricted-compliant regardless (see securityContext below).
  create: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

priorityClassName: ""

nodeSelector: {}
# Example — pin to ARM64 nodes:
# nodeSelector:
#   kubernetes.io/arch: arm64

tolerations: []

affinity: {}
# Example — pod anti-affinity (spread across nodes):
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchLabels:
#               app.kubernetes.io/name: homeassistant-operator
#           topologyKey: kubernetes.io/hostname

topologySpreadConstraints: []
# Example — spread across zones:
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: homeassistant-operator

# watchNamespaces: namespaces the operator will watch for HomeAssistant CRs.
# When empty, operator watches ALL namespaces (ClusterRoleBinding is used).
# When set, operator watches ONLY the listed namespaces (per-namespace RoleBindings are created,
# ClusterRoleBinding is NOT created — more secure, least-privilege).
# NOTE: the operator's own namespace is NOT automatically included — add it explicitly if
# you deploy HomeAssistant resources there (same namespace as the operator itself).
# Example:
# watchNamespaces:
#   - homeassistant
#   - homeassistant-dev
watchNamespaces: []

# metricsNetworkPolicy restricts ingress to the operator's own /metrics endpoint
# to namespaces labeled "metrics: enabled". Off by default (opt-in) — egress is
# intentionally not restricted here, since there is no portable way to address
# the Kubernetes API server across cluster types/CNIs from a generic chart.
# NOTE: unrelated to spec.alpha.networkPolicy.enabled on the HomeAssistant CR,
# which instead protects the Home Assistant pod itself.
metricsNetworkPolicy:
  enabled: false
