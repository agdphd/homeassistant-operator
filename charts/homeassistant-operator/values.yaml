image:
  repository: ghcr.io/przemekhys/homeassistant-operator
  # Defaults to chart appVersion when empty
  tag: "1.1.0-rc.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Defaults to fullname when empty
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

priorityClassName: ""

nodeSelector: {}
# Example — pin to ARM64 nodes:
# nodeSelector:
#   kubernetes.io/arch: arm64

tolerations: []

affinity: {}
# Example — pod anti-affinity (spread across nodes):
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchLabels:
#               app.kubernetes.io/name: homeassistant-operator
#           topologyKey: kubernetes.io/hostname

topologySpreadConstraints: []
# Example — spread across zones:
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: homeassistant-operator

# watchNamespaces: namespaces the operator will watch for HomeAssistant CRs.
# When empty, operator watches ALL namespaces (ClusterRoleBinding is used).
# When set, operator watches ONLY the listed namespaces (per-namespace RoleBindings are created,
# ClusterRoleBinding is NOT created — more secure, least-privilege).
# NOTE: the operator's own namespace is NOT automatically included — add it explicitly if
# you deploy HomeAssistant resources there (same namespace as the operator itself).
# Example:
# watchNamespaces:
#   - homeassistant
#   - homeassistant-dev
watchNamespaces: []
