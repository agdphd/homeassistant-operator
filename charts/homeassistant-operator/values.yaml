image:
  repository: ghcr.io/przemekhys/homeassistant-operator
  # Defaults to chart appVersion when empty
  tag: "1.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Defaults to fullname when empty
  name: ""
  annotations: {}

namespace:
  # create: when true, the chart renders the release Namespace and labels it to
  # enforce the "restricted" Pod Security Standard (version latest). Install the
  # chart WITHOUT `--create-namespace` so the chart owns the namespace, e.g.:
  #   helm install ha-operator ... -n homeassistant-operator-system --set namespace.create=true
  # When false (default), Helm/you manage the namespace and no PSA labels are added;
  # the operator pod is restricted-compliant regardless (see securityContext below).
  create: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

priorityClassName: ""

nodeSelector: {}
# Example — pin to ARM64 nodes:
# nodeSelector:
#   kubernetes.io/arch: arm64

tolerations: []

affinity: {}
# Example — pod anti-affinity (spread across nodes):
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchLabels:
#               app.kubernetes.io/name: homeassistant-operator
#           topologyKey: kubernetes.io/hostname

topologySpreadConstraints: []
# Example — spread across zones:
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: homeassistant-operator

# watchNamespaces: namespaces the operator will watch for HomeAssistant CRs.
# When empty, operator watches ALL namespaces (ClusterRoleBinding is used).
# When set, operator watches ONLY the listed namespaces (per-namespace RoleBindings are created,
# ClusterRoleBinding is NOT created — more secure, least-privilege).
# NOTE: the operator's own namespace is NOT automatically included — add it explicitly if
# you deploy HomeAssistant resources there (same namespace as the operator itself).
# Example:
# watchNamespaces:
#   - homeassistant
#   - homeassistant-dev
watchNamespaces: []

# metricsNetworkPolicy restricts ingress to the operator's own /metrics endpoint
# to namespaces labeled "metrics: enabled". Off by default (opt-in) — egress is
# intentionally not restricted here, since there is no portable way to address
# the Kubernetes API server across cluster types/CNIs from a generic chart.
# NOTE: unrelated to spec.alpha.networkPolicy.enabled on the HomeAssistant CR,
# which instead protects the Home Assistant pod itself.
metricsNetworkPolicy:
  enabled: false

# webhook configures the operator's validating admission webhook, which checks
# HomeAssistant resources (currently TLS configuration coherence) at admission time.
#
# ENABLED BY DEFAULT (opt-out): set webhook.enabled=false to turn it off entirely
# (the operator runs with ENABLE_WEBHOOKS=false and no webhook resources render).
#
# The serving certificate is **self-managed** by the operator by default — it
# generates and rotates a self-signed certificate and injects the CA into its own
# ValidatingWebhookConfiguration, so **no cert-manager is required**.
webhook:
  enabled: true
  # certManager.enabled: opt IN to have cert-manager issue the serving certificate
  # instead of the operator self-managing it (a self-signed Issuer + Certificate are
  # rendered and the CA is injected via cert-manager.io/inject-ca-from). REQUIRES
  # cert-manager installed. When false (default), the operator self-manages the cert
  # — no cert-manager dependency.
  certManager:
    enabled: false
  # port is the webhook server port on the operator pod.
  port: 9443
  # failurePolicy for the ValidatingWebhookConfiguration (Fail or Ignore). Ignore
  # (default) makes validation best-effort — HomeAssistant create/update is never
  # blocked while the webhook is unavailable (e.g. during an operator rollout).
  # Set Fail to strictly reject invalid resources.
  failurePolicy: Ignore
