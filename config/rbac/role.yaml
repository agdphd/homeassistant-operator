---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ha.homeassistant.io
  resources:
  - homeassistants
  - homeassistantsecrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ha.homeassistant.io
  resources:
  - homeassistants/finalizers
  - homeassistantsecrets/finalizers
  verbs:
  - update
- apiGroups:
  - ha.homeassistant.io
  resources:
  - homeassistants/status
  - homeassistantsecrets/status
  verbs:
  - get
  - patch
  - update
