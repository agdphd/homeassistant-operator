# This rule is not used by the project homeassistant-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ha.homeassistant.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: homeassistant-operator
    app.kubernetes.io/managed-by: kustomize
  name: homeassistantlabel-viewer-role
rules:
- apiGroups:
  - ha.homeassistant.io
  resources:
  - homeassistantlabels
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ha.homeassistant.io
  resources:
  - homeassistantlabels/status
  verbs:
  - get
