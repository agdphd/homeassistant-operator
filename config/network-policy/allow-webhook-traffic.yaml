# This NetworkPolicy allows ingress traffic to the validating admission
# webhook running as part of the controller-manager, from specific
# namespaces and pods. CR(s) which trigger the webhook only work when
# applied from namespaces labeled with 'webhook: enabled'.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: homeassistant-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-webhook-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: homeassistant-operator
  policyTypes:
    - Ingress
  ingress:
    # This allows ingress traffic from any namespace with the label webhook: enabled
    - from:
      - namespaceSelector:
          matchLabels:
            webhook: enabled # Only from namespaces with this label
      ports:
        - port: 9443
          protocol: TCP
