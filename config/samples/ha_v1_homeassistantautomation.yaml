apiVersion: ha.homeassistant.io/v1
kind: HomeAssistantAutomation
metadata:
  labels:
    app.kubernetes.io/name: homeassistant-operator
    app.kubernetes.io/managed-by: kustomize
  name: homeassistantautomation-sample
spec:
  # Reference to the HomeAssistant instance
  homeAssistantRef:
    name: homeassistant-sample

  # Human-readable name for the automation
  alias: "Turn on lights at sunset"

  # Optional description
  description: "Automatically turn on living room lights when the sun sets"

  # Automation triggers - at least one required
  # This uses the new triggers syntax (plural) introduced in Home Assistant 2024+
  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:30:00"  # 30 minutes before sunset

  # Optional conditions - all must be true for automation to run
  conditions:
    - condition: state
      entity_id: binary_sensor.someone_home
      state: "on"

  # Actions to perform - at least one required
  actions:
    - action: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness: 200
        color_temp: 400
    - action: notify.mobile_app
      data:
        message: "Living room lights turned on at sunset"

  # Execution mode (optional)
  # Options: single, restart, queued, parallel
  # Default: single
  mode: single

  # Maximum concurrent runs (for queued/parallel modes)
  max: 10

  # Log level when max exceeded (optional)
  # Options: silent, info, warning, error
  # Default: warning
  maxExceeded: warning

  # Initial state when Home Assistant starts (optional)
  # If not specified, last state is restored
  initialState: true

  # Auto-reload when automation changes (optional)
  # Default: true
  autoReload: true

  # Enable/disable the automation (optional)
  # Default: true
  enabled: true
