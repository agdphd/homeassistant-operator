# Example Secret with Home Assistant secrets.yaml
# This is an optional Secret that can be referenced by HomeAssistant CR
#
# IMPORTANT: In production, use Sealed Secrets, External Secrets, or Vault
# Do NOT commit real secrets to git!
apiVersion: v1
kind: Secret
metadata:
  name: homeassistant-secrets
type: Opaque
stringData:
  secrets.yaml: |
    # Home Assistant Secrets
    # https://www.home-assistant.io/docs/configuration/secrets/
    #
    # Usage in configuration.yaml: !secret key_name

    # Example database credentials
    db_url: postgresql://homeassistant:changeme@postgres:5432/homeassistant

    # Example MQTT credentials
    mqtt_user: homeassistant
    mqtt_password: changeme

    # Example API keys
    # openweathermap_api_key: your_api_key_here
    # telegram_bot_token: your_token_here

    # Example coordinates (for privacy)
    # home_latitude: 52.2297
    # home_longitude: 21.0122
