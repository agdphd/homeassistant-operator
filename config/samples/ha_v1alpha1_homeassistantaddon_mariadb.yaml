apiVersion: ha.homeassistant.io/v1alpha1
kind: HomeAssistantAddon
metadata:
  labels:
    app.kubernetes.io/name: homeassistant-operator
    app.kubernetes.io/managed-by: kustomize
  name: mariadb
spec:
  homeAssistantRef:
    name: homeassistant-sample

  # Use built-in MariaDB profile (mariadb:11)
  # Provides: MySQL on port 3306, 5Gi persistent storage
  profile: mariadb

  # Optional: pin to a specific version (default: "11")
  # version: "11.4"

  # MariaDB requires a root password via environment variable.
  # Use a Kubernetes Secret reference for production setups.
  env:
    - name: MARIADB_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: mariadb-secret
          key: root-password
    # Optional: create a dedicated database and user for Home Assistant
    - name: MARIADB_DATABASE
      value: homeassistant
    - name: MARIADB_USER
      value: homeassistant
    - name: MARIADB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: mariadb-secret
          key: ha-password

  # MariaDB does not have built-in haIntegration because the recorder
  # connection string includes credentials not known at the profile level.
  # Configure manually in HomeAssistantConfiguration:
  #
  # recorder:
  #   db_url: mysql://homeassistant:REPLACE_ME@mariadb-homeassistant-sample.default.svc.cluster.local/homeassistant?charset=utf8mb4
  #   purge_keep_days: 10
