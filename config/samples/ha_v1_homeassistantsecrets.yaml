apiVersion: ha.homeassistant.io/v1
kind: HomeAssistantSecrets
metadata:
  labels:
    app.kubernetes.io/name: homeassistant-operator
    app.kubernetes.io/managed-by: kustomize
  name: my-home-secrets
spec:
  # Reference to the HomeAssistant instance that will use these secrets
  homeAssistantRef:
    name: homeassistant-sample

  # Automatically restart Home Assistant pod when secrets change (default: true)
  # Set to false if using external tools like Stakater Reloader
  autoRestart: true

  # List of Kubernetes Secrets to merge into secrets.yaml
  secretRefs:
    # Example: MQTT credentials
    - name: mqtt-credentials
      keys:
        - mqtt_user
        - mqtt_password

    # Example: Database URL
    - name: database-credentials
      keys:
        - db_url

    # Example: HTTP authentication
    # If keys are not specified, all keys from the secret will be included
    - name: http-credentials
