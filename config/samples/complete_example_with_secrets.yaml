# Complete example: HomeAssistant with auto-generated secrets
# This demonstrates how to use HomeAssistantSecrets to manage secrets

---
# Step 1: Create Kubernetes Secrets with your sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: ha-mqtt-creds
type: Opaque
stringData:
  mqtt_broker_user: "homeassistant"
  mqtt_broker_password: "changeme"

---
apiVersion: v1
kind: Secret
metadata:
  name: ha-db-creds
type: Opaque
stringData:
  recorder_db_url: "postgresql://ha:password@postgres:5432/homeassistant"

---
# Step 2: Create HomeAssistant instance
apiVersion: ha.homeassistant.io/v1alpha1
kind: HomeAssistant
metadata:
  name: my-home
spec:
  version: "2024.1"
  storage:
    size: 10Gi
  service:
    type: LoadBalancer
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

---
# Step 3: Create HomeAssistantSecrets to auto-generate secrets.yaml
apiVersion: ha.homeassistant.io/v1alpha1
kind: HomeAssistantSecrets
metadata:
  name: my-home-secrets
spec:
  homeAssistantRef:
    name: my-home  # Must match HomeAssistant name above

  # Automatically restart pod when secrets change (default: true)
  # Set to false if you prefer manual restarts or use Stakater Reloader
  autoRestart: true

  secretRefs:
    - name: ha-mqtt-creds
      keys:
        - mqtt_broker_user
        - mqtt_broker_password

    - name: ha-db-creds
      keys:
        - recorder_db_url

# The operator will:
# 1. Collect secrets from ha-mqtt-creds and ha-db-creds
# 2. Generate a secrets.yaml file with these entries
# 3. Create a Secret named "my-home-generated-secrets"
# 4. Mount it into the Home Assistant pod at /config/secrets.yaml
# 5. When autoRestart is true: update StatefulSet annotation to trigger rolling restart
