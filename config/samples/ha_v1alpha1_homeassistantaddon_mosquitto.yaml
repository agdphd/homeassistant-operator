apiVersion: ha.homeassistant.io/v1alpha1
kind: HomeAssistantAddon
metadata:
  labels:
    app.kubernetes.io/name: homeassistant-operator
    app.kubernetes.io/managed-by: kustomize
  name: mosquitto
spec:
  homeAssistantRef:
    name: homeassistant-sample

  # Use built-in Mosquitto profile (eclipse-mosquitto:2)
  # Provides: MQTT broker on port 1883, WebSocket on 9001,
  # 1Gi persistent storage, default mosquitto.conf config
  profile: mosquito

  # Optional: pin to a specific version (default: "2")
  # version: "2.0.18"

  # Optional: automatic Home Assistant MQTT integration
  # Adds the mqtt: section to HomeAssistantConfiguration CR,
  # which triggers a hot-reload of Home Assistant.
  # The broker address is computed from the Service DNS automatically.
  haIntegration:
    section: mqtt
    configuration:
      discovery: true
