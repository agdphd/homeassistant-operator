---
# Example Kubernetes Secrets for use with HomeAssistantSecrets
# In production, use proper secret management (Sealed Secrets, Vault, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: mqtt-credentials
type: Opaque
stringData:
  mqtt_user: "homeassistant"
  mqtt_password: "changeme123"

---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
type: Opaque
stringData:
  db_url: "postgresql://ha:password@postgres:5432/homeassistant"

---
apiVersion: v1
kind: Secret
metadata:
  name: http-credentials
type: Opaque
stringData:
  http_password: "supersecret"
  api_token: "abcd1234"
