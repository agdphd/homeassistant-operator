apiVersion: ha.homeassistant.io/v1alpha1
kind: HomeAssistantAddon
metadata:
  labels:
    app.kubernetes.io/name: homeassistant-operator
    app.kubernetes.io/managed-by: kustomize
  name: zigbee2mqtt
spec:
  homeAssistantRef:
    name: homeassistant-sample

  # Custom image — no built-in profile needed.
  # Use this approach for any addon not covered by the built-in profiles.
  image: koenkk/zigbee2mqtt:latest

  ports:
    - name: http
      port: 8080
      protocol: TCP

  # Persistent storage for Zigbee2MQTT data and device database
  storage:
    size: 1Gi
    mountPath: /app/data

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"

  # Configuration file for Zigbee2MQTT
  config:
    mountPath: /app/data
    data:
      configuration.yaml: |
        homeassistant:
          enabled: true
        permit_join: false
        mqtt:
          base_topic: zigbee2mqtt
          server: mqtt://homeassistant-sample-mosquitto.default.svc.cluster.local:1883
        serial:
          port: /dev/ttyUSB0
        frontend:
          enabled: true
          port: 8080

  # Mount the Zigbee USB dongle from the host
  volumeMounts:
    - name: zigbee-dongle
      mountPath: /dev/ttyUSB0

  volumes:
    - name: zigbee-dongle
      hostPath:
        path: /dev/ttyUSB0
        type: CharDevice

  # Security context required to access the USB device
  securityContext:
    privileged: true

  # Optional: expose web UI via Ingress
  # ingress:
  #   enabled: true
  #   host: zigbee2mqtt.example.com
