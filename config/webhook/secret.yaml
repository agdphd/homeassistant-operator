# Empty Secret that cert-controller (in the operator) populates with the
# self-managed webhook serving certificate and CA. It must pre-exist —
# cert-controller updates it but never creates it. namePrefix makes this
# homeassistant-operator-webhook-server-cert, matching WEBHOOK_SECRET_NAME.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: system
type: Opaque
