version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 200
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - misspell
        text: "(?i)mosquitto"  # Eclipse Mosquitto MQTT broker - official product name
      - linters:
          - lll
        path: api/*
      - linters:
          - lll
        source: "// \\+kubebuilder:"
      - linters:
          - dupl
        path: _test\.go$
      - linters:
          - goconst
        path: _test\.go$
      - linters:
          - dupl
        path: ^test/
      - linters:
          - dupl
        path: zz_generated\.
      - linters:
          - dupl
        path: groupversion_info\.go$
      - linters:
          - dupl
        path: ^cmd/main\.go$
      - linters:
          - dupl
        path: homeassistant(floor|label|area)_controller\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
